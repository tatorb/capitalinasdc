<!-- @dsCard group="Colors" viewport="700x250" name="Sky / Brand blues" subtitle="Sampled from the logo's cloud portal — the living accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);font-family:var(--font-sans);padding:22px 24px}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:0}
  .sw{height:96px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .meta{font-family:var(--font-mono);font-size:10px;line-height:1.35;color:#fff;mix-blend-mode:difference}
  .meta b{display:block;font-weight:600}
  .cap{display:flex;justify-content:space-between;margin-top:14px;color:var(--text-muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--sky-900)"><span class="meta"><b>900</b>102A4A</span></div>
    <div class="sw" style="background:var(--sky-800)"><span class="meta"><b>800</b>16365E</span></div>
    <div class="sw" style="background:var(--sky-700)"><span class="meta"><b>700</b>1E4C82</span></div>
    <div class="sw" style="background:var(--sky-600)"><span class="meta"><b>600</b>2A5C9A</span></div>
    <div class="sw" style="background:var(--sky-500)"><span class="meta"><b>500★</b>3368B5</span></div>
    <div class="sw" style="background:var(--sky-400)"><span class="meta"><b>400</b>4D86CC</span></div>
    <div class="sw" style="background:var(--sky-300)"><span class="meta"><b>300</b>6CB4DE</span></div>
    <div class="sw" style="background:var(--sky-200)"><span class="meta" style="color:#000">​<b>200</b>90D8F7</span></div>
    <div class="sw" style="background:var(--sky-100)"><span class="meta" style="color:#000">​<b>100</b>BBE2F0</span></div>
    <div class="sw" style="background:var(--sky-50)"><span class="meta" style="color:#000">​<b>50</b>CCEEFB</span></div>
  </div>
  <div class="cap"><span>★ 500 — primary brand blue</span><span>--sky-900 → --sky-50</span></div>
</body>
</html>
