<!-- @dsCard group="Type" viewport="700x300" name="Display — Cinzel" subtitle="Cinzel 400 — H1 & wordmark ONLY; everything else is sans (substitute)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);font-family:var(--font-sans);padding:26px 28px;color:var(--text-strong)}
  .d1{font-family:var(--font-display);font-weight:400;font-size:56px;letter-spacing:var(--tracking-display);line-height:1.05;margin:0}
  .d2{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:var(--tracking-display);margin:14px 0 0;color:var(--text-body)}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:18px;display:flex;gap:24px}
</style>
</head>
<body>
  <p class="d1">CAPITALINAS</p>
  <p class="d2">Innovando en tecnología</p>
  <div class="meta"><span>Cinzel 400</span><span>--font-display</span><span>h1 / wordmark only</span></div>
</body>
</html>
