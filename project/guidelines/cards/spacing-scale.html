<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="4px base grid — generous architectural rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--white);font-family:var(--font-mono);padding:24px 28px;color:var(--text-on-light)}
  .row{display:flex;align-items:center;gap:14px;padding:5px 0}
  .bar{height:16px;background:var(--ink-300);border-radius:0}
  .lbl{width:74px;font-size:11px;color:var(--text-muted-on-light);flex:none}
</style>
</head>
<body>
  <div class="row"><span class="lbl">1 · 4px</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="lbl">2 · 8px</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="lbl">4 · 16px</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="lbl">6 · 24px</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="lbl">10 · 40px</span><span class="bar" style="width:40px"></span></div>
  <div class="row"><span class="lbl">16 · 64px</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="lbl">24 · 96px</span><span class="bar" style="width:96px"></span></div>
</body>
</html>
