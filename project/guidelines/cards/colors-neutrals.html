<!-- @dsCard group="Colors" viewport="700x250" name="Ink & Cloud neutrals" subtitle="The black field of the logo through to cloud-white" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--cloud-50);font-family:var(--font-sans);padding:22px 24px}
  .row{display:grid;grid-template-columns:repeat(12,1fr);gap:0;border:1px solid var(--border-on-light)}
  .sw{height:96px;display:flex;align-items:flex-end;padding:7px;box-sizing:border-box}
  .meta{font-family:var(--font-mono);font-size:9.5px;line-height:1.3}
  .meta b{display:block;font-weight:600}
  .cap{display:flex;justify-content:space-between;margin-top:14px;color:var(--text-muted-on-light);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink-900)"><span class="meta" style="color:#fff"><b>900</b>000000</span></div>
    <div class="sw" style="background:var(--ink-850)"><span class="meta" style="color:#fff"><b>850</b>06090F</span></div>
    <div class="sw" style="background:var(--ink-800)"><span class="meta" style="color:#fff"><b>800</b>0F141C</span></div>
    <div class="sw" style="background:var(--ink-700)"><span class="meta" style="color:#fff"><b>700</b>161C26</span></div>
    <div class="sw" style="background:var(--ink-600)"><span class="meta" style="color:#fff"><b>600</b>202733</span></div>
    <div class="sw" style="background:var(--ink-500)"><span class="meta" style="color:#fff"><b>500</b>2E3845</span></div>
    <div class="sw" style="background:var(--ink-400)"><span class="meta" style="color:#fff"><b>400</b>45525F</span></div>
    <div class="sw" style="background:var(--ink-300)"><span class="meta" style="color:#fff"><b>300</b>6B7785</span></div>
    <div class="sw" style="background:var(--ink-200)"><span class="meta"><b>200</b>9AA5B1</span></div>
    <div class="sw" style="background:var(--ink-100)"><span class="meta"><b>100</b>DCE3EA</span></div>
    <div class="sw" style="background:var(--cloud-50)"><span class="meta"><b>50</b>F1F6FB</span></div>
    <div class="sw" style="background:var(--white)"><span class="meta"><b>W</b>FFFFFF</span></div>
  </div>
  <div class="cap"><span>Black field → cloud white</span><span>--ink-900 → --white</span></div>
</body>
</html>
