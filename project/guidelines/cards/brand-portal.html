<!-- @dsCard group="Brand" viewport="700x300" name="The portal motif" subtitle="A vertical aperture onto sky — the brand's signature device" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);font-family:var(--font-sans);height:300px;box-sizing:border-box;display:flex;align-items:center;gap:34px;padding:0 36px;color:var(--text-strong)}
  .portals{display:flex;gap:18px;align-items:center}
  .portal{width:104px;height:232px;background-image:url('../../assets/portal-motif.jpg');background-size:cover;background-position:center;box-shadow:var(--shadow-lg)}
  .portal.sm{width:60px;height:134px}
  .portal.round{border-radius:8px}
  .notes{display:flex;flex-direction:column;gap:10px;max-width:280px}
  .notes h4{font-family:var(--font-sans);font-weight:400;font-size:18px;letter-spacing:.02em;margin:0}
  .notes p{font-size:12.5px;line-height:1.6;color:var(--text-muted);margin:0}
  code{font-family:var(--font-mono);font-size:11px;color:var(--text-body)}
</style>
</head>
<body>
  <div class="portals">
    <div class="portal"></div>
    <div class="portal sm"></div>
  </div>
  <div class="notes">
    <h4>Window to the sky</h4>
    <p>A tall <code>1 : 2</code> aperture revealing cloud and blue. Use it to frame hero imagery, section breaks and figure crops — openness, reach, reliability.</p>
  </div>
</body>
</html>
