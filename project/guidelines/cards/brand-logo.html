<!-- @dsCard group="Brand" viewport="700x300" name="Logo / wordmark lockup" subtitle="The original mark — engraved caps over the sky portal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);font-family:var(--font-sans);padding:0;color:var(--text-strong);display:flex;align-items:center;gap:40px;height:300px;box-sizing:border-box;padding:0 36px}
  .mark{height:236px;display:block}
  .notes{display:flex;flex-direction:column;gap:12px}
  .notes h4{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.04em;margin:0;color:#fff}
  .notes p{font-size:12.5px;line-height:1.6;color:var(--text-muted);margin:0;max-width:300px}
  .swatch{display:flex;gap:6px;margin-top:4px}
  .swatch span{width:26px;height:26px;border-radius:2px;border:1px solid var(--border-subtle)}
</style>
</head>
<body>
  <img class="mark" src="../../assets/logo-datacenter-capitalinas.jpg" alt="Datacenter Capitalinas">
  <div class="notes">
    <h4 style="font-family: Cinzel; font-weight: 400">Primary mark</h4>
    <p>Always on the black field. Maintain clear space equal to the portal's width on every side. Never recolour the wordmark or stretch the aperture.</p>
    <div class="swatch">
      <span style="background:var(--ink-900)"></span>
      <span style="background:var(--sky-500)"></span>
      <span style="background:var(--sky-200)"></span>
      <span style="background:var(--white)"></span>
    </div>
  </div>
</body>
</html>
