<!-- @dsCard group="Type" viewport="700x230" name="Mono — IBM Plex Mono" subtitle="Technical specs, uptime, IP and tabular figures" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-850);font-family:var(--font-mono);padding:24px 28px;color:var(--text-body)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 32px;max-width:600px}
  .kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--border-subtle);padding:8px 0;font-size:14px}
  .k{color:var(--text-muted)}
  .v{color:var(--text-strong);font-weight:500}
  .big{font-size:30px;color:var(--text-strong);font-weight:500;margin:0 0 14px;letter-spacing:-.01em}
</style>
</head>
<body>
  <p class="big">99.98% · 1 Gbps · 24/7</p>
  <div class="grid">
    <div class="kv"><span class="k">UPTIME_SLA</span><span class="v">99.98%</span></div>
    <div class="kv"><span class="k">FIBRA</span><span class="v">1 Gbps</span></div>
    <div class="kv"><span class="k">RACKS_AAA</span><span class="v">42U</span></div>
    <div class="kv"><span class="k">SOPORTE</span><span class="v">24/7/365</span></div>
  </div>
</body>
</html>
