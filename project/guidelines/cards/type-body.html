<!-- @dsCard group="Type" viewport="700x320" name="Body — IBM Plex Sans" subtitle="Regular by default; weight reserved for emphasis only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--white);font-family:var(--font-sans);padding:24px 28px;color:var(--text-on-light)}
  .scale > div{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--divider-on-light);padding:7px 0}
  .scale .s{font-weight:400}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-muted-on-light);width:120px;flex:none}
  .body{font-size:14px;line-height:1.6;color:var(--text-muted-on-light);margin:16px 0 0;max-width:560px}
</style>
</head>
<body>
  <div class="scale">
    <div><span class="tag">5xl · 400</span><span class="s" style="font-size:40px">Alta disponibilidad</span></div>
    <div><span class="tag">2xl · 400</span><span class="s" style="font-size:24px">Conectividad de fibra óptica</span></div>
    <div><span class="tag">base · 400</span><span style="font-size:16px">Entorno controlado y seguro</span></div>
    <div><span class="tag">base · 600</span><span style="font-size:16px;font-weight:600">Solo para <strong>resaltar</strong></span></div>
  </div>
  <p class="body">Los servicios permiten el alojamiento y uso de servidores en un entorno controlado y seguro, con conectividad de calidad superior a 1&nbsp;Gbps.</p>
</body>
</html>
