<!-- @dsCard group="Components" viewport="700x190" name="Feature grid" subtitle="Borderless columns split by hairline gray dividers — neutral, flat" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-900);font-family:var(--font-sans);padding:0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
  .cell{padding:26px 26px 30px}
  .cell + .cell{border-left:1px solid var(--border-subtle)}
  .cell i{color:var(--text-strong)}
  .lbl{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-strong);margin:26px 0 10px}
  .body{font-size:13px;line-height:1.5;color:var(--text-muted);margin:0}
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><i data-lucide="rss" style="width:24px;height:24px"></i><div class="lbl">Tier 1 Connectivity</div><p class="body">Vínculos directos a carriers globales, baja latencia.</p></div>
    <div class="cell"><i data-lucide="square-code" style="width:24px;height:24px"></i><div class="lbl">Developer-first</div><p class="body">API completa y provider de Terraform.</p></div>
    <div class="cell"><i data-lucide="shield-check" style="width:24px;height:24px"></i><div class="lbl">Redundante</div><p class="body">De la red al rack, cada sistema con respaldo.</p></div>
  </div>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
